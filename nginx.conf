# ==============================================================================
# ApexRad Enterprise DICOM Web Viewer & PACS Gateway - NGINX Reverse Proxy
# Production Configuration with TLS 1.3, HTTP/2, and Healthcare Security Headers
# ==============================================================================

# Redirect all plain HTTP traffic to secure HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name pacs.hospital.internal viewer.radiology.hospital.org;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pacs.hospital.internal viewer.radiology.hospital.org;

    # SSL / TLS Certificates (Replace with your hospital's validated certificates)
    ssl_certificate /etc/ssl/certs/apexrad_hospital.crt;
    ssl_certificate_key /etc/ssl/private/apexrad_hospital.key;

    # Modern TLS Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Healthcare Privacy & Cyber-Defense Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Maximum upload size for large multiframe DICOM / CT volumes
    client_max_body_size 500M;
    client_body_buffer_size 128k;

    # Compression for text, JSON, and DICOM metadata (excluding already compressed pixel data)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1000;

    # Proxy to Node.js Backend Service
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for large multi-slice volumetric queries (MPR / 3D CT)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Dedicated DICOMweb endpoint caching and streaming optimizations
    location /api/dicomweb/ {
        proxy_pass http://127.0.0.1:3000/api/dicomweb/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming optimizations for bulk pixel transfers
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }
}
